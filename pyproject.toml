[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veltronlm"
version = "0.1.0-alpha"
description = "A real ~4B-parameter open-weight decoder-only Transformer and customer-support AI system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

dependencies = [
  "torch>=2.1",
  "tokenizers>=0.15",
  "safetensors>=0.4",
  "numpy>=1.24",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "mypy>=1.8", "pyyaml"]
pdf = ["pypdf>=4"]
gpu-directml = ["torch-directml==0.2.5.dev240914"]

[project.scripts]
veltron = "veltron.cli:main"

[tool.setuptools.packages.find]
include = ["veltron*"]

[tool.setuptools.package-data]
veltron = ["chatbot/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = [
  "gpu: requires an accelerator",
  "slow: takes more than a minute",
  "integration: exercises multiple subsystems",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false